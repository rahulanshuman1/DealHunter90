name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Lets the app/ and gradle/ folders be uploaded as ONE file (app-source.zip), which is easier
      # than uploading folders through the GitHub website. Unpacked next to settings.gradle.kts.
      - name: Unpack app-source.zip (if present)
        shell: bash {0}
        run: |
          ZIP=$(find . -maxdepth 2 -name 'app-source.zip' -not -path './.git/*' | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -oq "$ZIP" -d "$(dirname "$ZIP")" && echo "Unpacked $ZIP"
          else
            echo "No app-source.zip found; using the folders as uploaded."
          fi

      # Handles files that were uploaded loose at the top level instead of inside folders.
      - name: Repair folder structure (if files were uploaded flat)
        shell: bash {0}
        run: |
          K=app/src/main/kotlin/app/linkharvest
          if [ ! -f app/build.gradle.kts ] && [ -f MainActivity.kt ]; then
            echo "Flat upload detected: rebuilding the folder structure."
            mv_to() { if [ -f "$1" ]; then mkdir -p "$2"; mv -f "$1" "$2/"; fi; }
            mv_to MainActivity.kt "$K"
            for f in Platform.kt Discount.kt Run.kt RunStore.kt; do mv_to "$f" "$K/data"; done
            mv_to WebCollector.kt "$K/engine"
            for f in App.kt BrowserPanel.kt MainViewModel.kt ResultsScreen.kt SearchScreen.kt Theme.kt; do mv_to "$f" "$K/ui"; done
            for f in PlatformTest.kt DiscountParserTest.kt; do mv_to "$f" app/src/test/kotlin/app/linkharvest/data; done
            mv_to AndroidManifest.xml app/src/main
            mv_to proguard-rules.pro app
            mv_to strings.xml app/src/main/res/values
            mv_to colors.xml app/src/main/res/values
            mv_to ic_launcher.xml app/src/main/res/mipmap-anydpi
            mv_to ic_launcher_foreground.xml app/src/main/res/drawable
            mv_to gradle-wrapper.jar gradle/wrapper
            mv_to gradle-wrapper.properties gradle/wrapper
            # These names collide when flattened (two build.gradle.kts, two themes.xml), so recreate them.
            rm -f themes.xml "themes (1).xml"
            mkdir -p .
          cat > build.gradle.kts <<'GRADLE_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          GRADLE_EOF
            mkdir -p app
          cat > app/build.gradle.kts <<'GRADLE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          // Release signing is read from environment variables so no secrets live in the repo.
          // KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
          val releaseKeystore: String? = System.getenv("KEYSTORE_FILE")?.takeIf { it.isNotBlank() && file(it).exists() }

          android {
              namespace = "app.linkharvest"
              compileSdk = 35

              defaultConfig {
                  applicationId = "app.linkharvest"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1.0"
              }

              signingConfigs {
                  if (releaseKeystore != null) {
                      create("release") {
                          storeFile = file(releaseKeystore)
                          storePassword = System.getenv("KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("KEY_ALIAS")
                          keyPassword = System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      // Falls back to the debug key when no release keystore is supplied, so the
                      // APK is still installable for sideloading. Use a real keystore for Play Store.
                      signingConfig = if (releaseKeystore != null) signingConfigs.getByName("release")
                      else signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              buildFeatures { compose = true }

              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")

              val composeBom = platform("androidx.compose:compose-bom:2024.12.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              debugImplementation("androidx.compose.ui:ui-tooling")

              testImplementation("junit:junit:4.13.2")
          }
          GRADLE_EOF
            mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'GRADLE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LinkHarvest" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          GRADLE_EOF
            mkdir -p app/src/main/res/values-night
          cat > app/src/main/res/values-night/themes.xml <<'GRADLE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LinkHarvest" parent="android:Theme.Material.NoActionBar" />
          </resources>
          GRADLE_EOF
            echo "Folder structure rebuilt."
          else
            echo "Flat upload not detected; leaving files as they are."
          fi

      # Finds the Gradle project even if the files were uploaded inside a sub-folder.
      - name: Locate project
        id: project
        shell: bash {0}
        run: |
          echo "Files in repository (top 3 levels):"
          find . -maxdepth 3 -not -path './.git/*' | sort | head -80
          SETTINGS=$(find . -maxdepth 3 -name 'settings.gradle.kts' -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found. The project files were not uploaded correctly."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      # Fails early with a clear message if folders were left out of the upload.
      - name: Verify project files
        shell: bash {0}
        run: |
          DIR="${{ steps.project.outputs.dir }}"
          MISSING=0
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts \
                   app/src/main/AndroidManifest.xml app/src/main/kotlin/app/linkharvest/MainActivity.kt; do
            if [ ! -f "$DIR/$f" ]; then echo "::error::Missing file: $f"; MISSING=1; fi
          done
          if [ "$MISSING" = 1 ]; then
            {
              echo "## Upload problem"
              echo "Some project files are missing from the repository. Upload the whole **app** and **gradle** folders (drag the folders, not just the files inside them)."
              echo "### Files currently in the repository"
              echo '```'
              (cd "$DIR" && find . -type f -not -path './.git/*' | sort | head -100)
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All key project files are present."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        shell: bash {0}
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash {0}
        run: |
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit "${PIPESTATUS[0]}"

      # Uploaded even if a later step fails, so a built APK is never lost.
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DealHunter90-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Puts the reason for any failure at the top of the run's Summary page.
      - name: Show result in summary
        if: always()
        shell: bash {0}
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          APKDIR="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug"
          {
            echo "## Build result"
            if ls "$APKDIR"/*.apk >/dev/null 2>&1; then echo "**APK built: yes**"; else echo "**APK built: NO**"; fi
            if [ -f "$LOG" ]; then
              echo "### Kotlin compile errors"; echo '```'; grep -E '^e: ' "$LOG" | head -60; echo '```'
              echo "### What went wrong"; echo '```'; grep -A12 'What went wrong' "$LOG" | head -40; echo '```'
              echo "### Last 40 lines of the Gradle log"; echo '```'; tail -n 40 "$LOG"; echo '```'
            else
              echo "The Gradle build step did not run. Open the red step in the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.project.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
