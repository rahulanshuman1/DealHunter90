name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Finds the Gradle project even if the files were uploaded inside a sub-folder.
      - name: Locate project
        id: project
        shell: bash {0}
        run: |
          echo "Files in repository (top 3 levels):"
          find . -maxdepth 3 -not -path './.git/*' | sort | head -80
          SETTINGS=$(find . -maxdepth 3 -name 'settings.gradle.kts' -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found. The project files were not uploaded correctly."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project folder: $DIR"

      # Fails early with a clear message if folders were left out of the upload.
      - name: Verify project files
        shell: bash {0}
        run: |
          DIR="${{ steps.project.outputs.dir }}"
          MISSING=0
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts \
                   app/src/main/AndroidManifest.xml app/src/main/kotlin/app/linkharvest/MainActivity.kt; do
            if [ ! -f "$DIR/$f" ]; then echo "::error::Missing file: $f"; MISSING=1; fi
          done
          if [ "$MISSING" = 1 ]; then
            {
              echo "## Upload problem"
              echo "Some project files are missing from the repository. Upload the whole **app** and **gradle** folders (drag the folders, not just the files inside them)."
              echo "### Files currently in the repository"
              echo '```'
              (cd "$DIR" && find . -type f -not -path './.git/*' | sort | head -100)
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All key project files are present."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        shell: bash {0}
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash {0}
        run: |
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit "${PIPESTATUS[0]}"

      # Uploaded even if a later step fails, so a built APK is never lost.
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DealHunter90-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Puts the reason for any failure at the top of the run's Summary page.
      - name: Show result in summary
        if: always()
        shell: bash {0}
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          APKDIR="${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug"
          {
            echo "## Build result"
            if ls "$APKDIR"/*.apk >/dev/null 2>&1; then echo "**APK built: yes**"; else echo "**APK built: NO**"; fi
            if [ -f "$LOG" ]; then
              echo "### Kotlin compile errors"; echo '```'; grep -E '^e: ' "$LOG" | head -60; echo '```'
              echo "### What went wrong"; echo '```'; grep -A12 'What went wrong' "$LOG" | head -40; echo '```'
              echo "### Last 40 lines of the Gradle log"; echo '```'; tail -n 40 "$LOG"; echo '```'
            else
              echo "The Gradle build step did not run. Open the red step in the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.project.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
